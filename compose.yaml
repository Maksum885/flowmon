services:
    postgres:
        image: postgres:16
        container_name: flowmon-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: flowmon
            POSTGRES_USER: flowmon
            POSTGRES_PASSWORD: flowmon_dev
        ports:
            - "5433:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

    mosquitto:
        image: eclipse-mosquitto:2
        container_name: flowmon-mosquitto
        restart: unless-stopped
        ports:
            - "1883:1883"
        volumes:
            - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
            - ./docker/mosquitto/passwd:/mosquitto/config/passwd

volumes:
    pgdata:
